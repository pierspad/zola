name: Build & Test

on:
  push:
    branches: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  Tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        rustup_toolchain: [stable]
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rustup_toolchain }}

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo build (Rust TLS)
        run: cargo build --all

      - name: Cargo test
        run: cargo test --all

      - name: Release workload correctness smoke
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 benchmarks/release_suite.py --binary target/debug/zola --runs 2 --add-runs 2 --build-arg=--incremental --mutations --mutation-build-arg=--incremental --output benchmarks/results/ci-smoke.json

      - name: Benchmark accounting and release comparison checks
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 -m unittest discover -s benchmarks -p 'test_*.py'

      - name: Attest the debug fork smoke binary
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 benchmarks/fork_build.py --profile dev --output benchmarks/results/ci-fork-build.json

      - name: Official upstream comparison smoke
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 benchmarks/matrix.py --binary target/debug/zola --fork-build-metadata benchmarks/results/ci-fork-build.json --cases 8x1,24x2 --profiles newspaper --small-runs 1 --large-runs 1 --warmups 0 --reserve-gib 2 --output benchmarks/results/ci-upstream.json

      - name: Preserve benchmark evidence
        if: always() && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence
          path: benchmarks/results/

      - name: Test automatic cache sizing
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build the zola docs with detected cache allowance
        run: cd docs && python3 ../scripts/build_with_cache.py --binary ../target/debug/zola
